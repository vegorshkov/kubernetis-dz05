---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/k8s-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-pvc
spec:
  volumeName: local-pv
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-pvc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange-pvc
  template:
    metadata:
      labels:
        app: data-exchange-pvc
    spec:
      containers:
      - name: writer
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          counter=0
          while true; do
            echo "$(date '+%Y-%m-%d %H:%M:%S') - Message #$counter" > /shared/data.log
            counter=$((counter + 1))
            sleep 5
          done
        volumeMounts:
        - name: pvc-storage
          mountPath: /shared
      - name: reader
        image: wbitt/network-multitool:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          while true; do
            if [ -f /shared/data.log ]; then
              tail -n 1 /shared/data.log
            fi
            sleep 2
          done
        volumeMounts:
        - name: pvc-storage
          mountPath: /shared
      volumes:
      - name: pvc-storage
        persistentVolumeClaim:
          claimName: local-pvc
