apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange
  labels:
    app: data-exchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange
  template:
    metadata:
      labels:
        app: data-exchange
    spec:
      containers:
      - name: writer
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          counter=0
          while true; do
            echo "$(date '+%Y-%m-%d %H:%M:%S') - Message #$counter" > /shared/data.log
            counter=$((counter + 1))
            sleep 5
          done
        volumeMounts:
        - name: shared-volume
          mountPath: /shared
      - name: reader
        image: wbitt/network-multitool:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          while true; do
            if [ -f /shared/data.log ]; then
              tail -n 1 /shared/data.log
            fi
            sleep 2
          done
        volumeMounts:
        - name: shared-volume
          mountPath: /shared
      volumes:
      - name: shared-volume
        emptyDir: {}
