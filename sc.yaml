---
# 1. StorageClass для локального хранилища
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
# 2. PersistentVolume — это вручную созданное хранилище для StorageClass
#    (no-provisioner не создаёт PV автоматически)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: dynamic-pv
  labels:
    type: local
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: local-storage
  hostPath:
    path: /mnt/k8s-sc-data
---
# 3. PVC — это запрос на хранилище, который найдёт PV по storageClassName
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dynamic-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-storage
---
# 4. Deployment, использующий PVC
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-sc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange-sc
  template:
    metadata:
      labels:
        app: data-exchange-sc
    spec:
      containers:
      - name: writer
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          counter=0
          while true; do
            echo "$(date '+%Y-%m-%d %H:%M:%S') - SC-Message #$counter" > /shared/sc-data.log
            counter=$((counter + 1))
            sleep 5
          done
        volumeMounts:
        - name: sc-storage
          mountPath: /shared
      - name: reader
        image: wbitt/network-multitool:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          while true; do
            if [ -f /shared/sc-data.log ]; then
              cat /shared/sc-data.log
            fi
            sleep 2
          done
        volumeMounts:
        - name: sc-storage
          mountPath: /shared
      volumes:
      - name: sc-storage
        persistentVolumeClaim:
          claimName: dynamic-pvc
